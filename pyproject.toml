[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-security-tool"
description = "Local Git security and code-quality gate that runs on pre-commit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Mustafa Basit" }]
keywords = ["git", "pre-commit", "security", "secrets", "sast", "semgrep", "gitleaks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/MustafaBasit521/commit-guard"
Issues = "https://github.com/MustafaBasit521/commit-guard/issues"

[project.optional-dependencies]
# The scanners are optional: the wrappers skip any tool that is not installed.
# `pip install git-security-tool[scanners]` pulls the pip-installable ones.
# gitleaks is a Go binary and is always installed separately.
scanners = ["ruff", "semgrep"]
ai = ["anthropic"]  # only the anthropic AI provider needs this; gemini uses stdlib
dev = ["pytest", "ruff"]

[project.scripts]
git-security-tool = "git_security.cli:main"

[tool.hatch.version]
path = "src/git_security/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/git_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Pin an explicit rule set so `ruff check` behaves identically across ruff
# versions and whether it runs in the repo or in a materialized tree.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# Make first-party detection explicit so import sorting is identical whether
# ruff runs in the repo or in the throwaway tree the scanner materializes.
known-first-party = ["git_security"]
